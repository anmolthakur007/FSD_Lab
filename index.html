<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Registration Form</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="container">
    <h2>Create Account</h2>
    <form id="registerForm" novalidate>

      <div class="form-group">
        <label for="fullname">Full Name</label>
        <input type="text" id="fullname" placeholder="John Doe" />
        <span class="error" id="fullnameError"></span>
      </div>

      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" placeholder="john@example.com" />
        <span class="error" id="emailError"></span>
      </div>

      <div class="form-group">
        <label for="age">Age</label>
        <input type="number" id="age" placeholder="Enter your age" />
        <span class="error" id="ageError"></span>
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <div class="input-wrapper">
          <input type="password" id="password" placeholder="Enter password" />
          <span class="toggle-eye" onclick="togglePassword('password', this)">👁️</span>
        </div>
        <ul class="password-rules" id="passwordRules">
          <li id="rule-length">More than 3 characters</li>
          <li id="rule-upper">At least one uppercase letter</li>
          <li id="rule-lower">At least one lowercase letter</li>
          <li id="rule-special">At least one special character (!@#$%^&*)</li>
          <li id="rule-number">At least one number</li>
        </ul>
        <span class="error" id="passwordError"></span>
      </div>

      <div class="form-group">
        <label for="confirmPassword">Confirm Password</label>
        <div class="input-wrapper">
          <input type="password" id="confirmPassword" placeholder="Re-enter password" />
          <span class="toggle-eye" onclick="togglePassword('confirmPassword', this)">👁️</span>
        </div>
        <span class="error" id="confirmPasswordError"></span>
      </div>

      <button type="submit">Register</button>
      <p class="success-msg" id="successMsg"></p>
    </form>
  </div>
  <script src="script.js"></script>
</body>
</html>
